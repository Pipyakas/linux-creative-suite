# The KDE portal backend is gated behind UseIn=KDE in
# /usr/share/xdg-desktop-portal/portals/kde.portal, but XDG_CURRENT_DESKTOP is
# unset on this system, so xdg-desktop-portal fell back to gtk for every
# interface -- and gtk has no Screenshot implementation, so every screenshot
# silently produced an empty PNG.  Set the desktop explicitly and allow enough
# start time (the portal needs ~20s here, systemd's default is 15s).
[Service]
Environment=XDG_CURRENT_DESKTOP=KDE
Environment=XDG_SESSION_DESKTOP=plasma
TimeoutStartSec=90
